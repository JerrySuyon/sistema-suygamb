spring.application.name=sistema-suygamb

# PUERTO DINAMICO para Render / Railway
server.port=${PORT:5000}

# MYSQL - Si existe DATABASE_URL usa esa, si no usa tu localhost
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/suygamb_bd?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# THYMELEAF - En produccion true para que cargue rapido
spring.thymeleaf.cache=true

# SESSION
server.servlet.session.timeout=24h

# UPLOAD LOGO
app.upload.logo=uploads/logo/
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB